name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Kept in lockstep with release.yml — see the runner note there. Xcode 26 is
    # required to compile AppIcon.icon (Icon Composer format).
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -project FlipOff.xcodeproj \
            -scheme FlipOff \
            -resolvePackageDependencies

      # CI runners have no Apple Development identity, so the Team-ID-based
      # automatic signing in project.yml can't resolve. Build unsigned instead —
      # this only verifies the code compiles; signing is exercised in release.yml.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project FlipOff.xcodeproj \
            -scheme FlipOff \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify
