name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -project Bilakh.xcodeproj \
            -scheme Bilakh \
            -resolvePackageDependencies

      # CI runners have no Apple Development identity, so the Team-ID-based
      # automatic signing in project.yml can't resolve. Build unsigned instead —
      # this only verifies the code compiles; signing is exercised in release.yml.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Bilakh.xcodeproj \
            -scheme Bilakh \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify
