name: Bilakh
options:
  bundleIdPrefix: in.pooya
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

schemes:
  Bilakh:
    build:
      targets:
        Bilakh: all
        BilakhTests: [test]
    test:
      targets:
        - BilakhTests

targets:
  Bilakh:
    type: application
    platform: macOS
    sources:
      - path: Bilakh
    settings:
      base:
        PRODUCT_NAME: Bilakh
        PRODUCT_BUNDLE_DISPLAY_NAME: Bilakh
        INFOPLIST_FILE: Bilakh/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bilakh/Bilakh.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.bilakh.debug
          PRODUCT_BUNDLE_DISPLAY_NAME: Bilakh Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.bilakh
    dependencies:
      - target: BilakhCLI
        embed: true
        copy:
          # SharedSupport, not MacOS — `bilakh` would collide with the app binary
          # `Bilakh` on case-insensitive filesystems (DMG/Applications).
          destination: sharedSupport
      - package: Sparkle
      # Embedded Touch ID glyph on the lock screen (LAAuthenticationView). Without
      # this the prompt falls back to a system modal over the shield.
      - sdk: LocalAuthenticationEmbeddedUI.framework
  BilakhCLI:
    type: tool
    platform: macOS
    sources:
      - path: BilakhCLI
    settings:
      base:
        PRODUCT_NAME: bilakh
        # Module name must NOT case-collide with the app's `Bilakh` module — on a
        # case-insensitive filesystem `bilakh.swiftmodule` and `Bilakh.swiftmodule`
        # clash and break `@testable import Bilakh`. Executable stays `bilakh`.
        PRODUCT_MODULE_NAME: BilakhCLI
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  BilakhTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BilakhTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.bilakh.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bilakh.app/Contents/MacOS/Bilakh"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
    dependencies:
      - target: Bilakh
