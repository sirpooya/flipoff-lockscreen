name: FlipOff
options:
  bundleIdPrefix: in.pooya
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

schemes:
  FlipOff:
    build:
      targets:
        FlipOff: all
        FlipOffTests: [test]
    test:
      targets:
        - FlipOffTests

targets:
  FlipOff:
    type: application
    platform: macOS
    sources:
      - path: FlipOff
    settings:
      base:
        PRODUCT_NAME: FlipOff
        PRODUCT_BUNDLE_DISPLAY_NAME: FlipOff
        INFOPLIST_FILE: FlipOff/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlipOff/FlipOff.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.flipoff.debug
          PRODUCT_BUNDLE_DISPLAY_NAME: FlipOff Debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: in.pooya.flipoff
    dependencies:
      - target: FlipOffCLI
        embed: true
        copy:
          # SharedSupport, not MacOS — `flipoff` would collide with the app binary
          # `FlipOff` on case-insensitive filesystems (DMG/Applications).
          destination: sharedSupport
      - package: Sparkle
      # Embedded Touch ID glyph on the lock screen (LAAuthenticationView). Without
      # this the prompt falls back to a system modal over the shield.
      - sdk: LocalAuthenticationEmbeddedUI.framework
  FlipOffCLI:
    type: tool
    platform: macOS
    sources:
      - path: FlipOffCLI
    settings:
      base:
        PRODUCT_NAME: flipoff
        # Module name must NOT case-collide with the app's `FlipOff` module — on a
        # case-insensitive filesystem `flipoff.swiftmodule` and `FlipOff.swiftmodule`
        # clash and break `@testable import FlipOff`. Executable stays `flipoff`.
        PRODUCT_MODULE_NAME: FlipOffCLI
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  FlipOffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FlipOffTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.pooya.flipoff.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlipOff.app/Contents/MacOS/FlipOff"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37MA269X54
    dependencies:
      - target: FlipOff
